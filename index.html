<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Speaking Trainer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }
        h2 {
            text-align: center;
            color: #ff5252;
            margin: 5px 0;
            font-size: 1.2rem;
        }
        #chat-container {
            flex: 1;
            border: 1px solid #333;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px;
            border-radius: 6px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 0.95rem;
        }
        .user {
            background: #0d47a1;
            color: white;
            align-self: flex-end;
        }
        .ai {
            background: #b71c1c;
            color: white;
            align-self: flex-start;
        }
        .error-msg {
            background: #4a1515;
            color: #ff8a80;
            border: 1px solid #ff5252;
            align-self: center;
            width: 90%;
            text-align: center;
        }
        .input-area {
            display: flex;
            gap: 5px;
        }
        textarea {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: white;
            resize: none;
            height: 45px;
            font-size: 1rem;
        }
        button {
            padding: 10px 15px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>🔥 Shafqatsiz IELTS Examiner</h2>
    
    <div id="chat-container">
        <div class="message ai">Xo‘sh, nima demoqchisan? Savolga tezroq javob ber, senga bu oʻz uying emas! Gapirchi, eshitaman.</div>
    </div>

    <div class="input-area">
        <textarea id="user-input" placeholder="Javobingni yoz..."></textarea>
        <button onclick="sendMessage()">Yuborish</button>
    </div>

    <script>
        const apiKey = "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"; 

        const systemPrompt = "Sen juda qattiqqo'l, shafqatsiz va talabchan IELTS imtihonchisisan. Foydalanuvchi ingliz tilida yoki o'zbek tilida gapirsa ham, unga faqat O'ZBEK tilida, kerak bo'lsa ruscha qo'polroq so'zlar va jargonglarni aralashtirib, uning xatolarini va qanday gapirganini ayovsiz yuziga to'g'ri aytib tursan. Qattiq tanqid qil.";

        let chatHistory = [
            { role: "system", content: systemPrompt },
            { role: "assistant", content: "Xo‘sh, nima demoqchisan? Savolga tezroq javob ber, vaqtni o‘g‘irlama! Gapirchi, eshitaman." }
        ];

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const text = inputField.value.trim();

            if (!text) return;

            chatContainer.innerHTML += `<div class="message user">${text}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            chatHistory.push({ role: "user", content: text });

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "authorization/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: chatHistory,
                        temperature: 0.8
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.choices && data.choices.length > 0) {
                    const aiReply = data.choices[0].message.content;
                    chatContainer.innerHTML += `<div class="message ai">${aiReply}</div>`;
                    chatContainer.scrollTop = chatContainer.scrollHeight;

                    chatHistory.push({ role: "assistant", content: aiReply });
                    speakText(aiReply);
                } else {
                    const errMessage = data.error ? data.error.message : "Noma'lum xatolik";
                    chatContainer.innerHTML += `<div class="message error-msg">❌ Xato: ${errMessage}</div>`;
                }

            } catch (error) {
                chatContainer.innerHTML += `<div class="message error-msg">❌ Tarmoq xatosi: ${error.message}</div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'uz-UZ';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
