<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monos Speak - AI Examiner</title>
    <!-- ResponsiveVoice - Aniq erkak ovozini kafolatlaydigan bulutli motor -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        button {
            background: #cc0000;
            color: white;
            border: none;
            padding: 20px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 20px;
        }
        #status {
            font-size: 16px;
            color: #ffcc00;
            margin: 20px 0;
        }
        #subText {
            font-size: 18px;
            background: #111;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            min-height: 60px;
        }
    </style>
</head>
<body>

    <h1>MONOS SPEAK EXAMINER</h1>
    <div id="status">Tayyormisiz?</div>

    <button id="mainBtn" onclick="startExam()">IMTIHONNI BOSHLASH</button>

    <div id="subText">AI: Imtihonga xush kelibsiz!</div>

    <script>
        const statusBadge = document.getElementById('status');
        const mainBtn = document.getElementById('mainBtn');
        const subText = document.getElementById('subText');

        const questions = [
            "Describe your hometown. What do you like most about it?",
            "Do you work or are you a student?",
            "What do you usually do in your free time?"
        ];
        let currentQIndex = 0;
        let recognition = null;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
        }

        function startExam() {
            mainBtn.style.display = 'none';
            // ResponsiveVoice motorini faollashtirish
            if (window.responsiveVoice) {
                responsiveVoice.speak("", "UK English Male");
            }
            askQuestion();
        }

        function askQuestion() {
            let qText = questions[currentQIndex];
            statusBadge.innerText = "AI Examiner gapirmoqda...";
            subText.innerHTML = `<b>AI:</b> ${qText}`;

            // UK English Male — Haqiqiy jiddiy Britancha dag'al erkak ovozi
            responsiveVoice.speak(qText, "UK English Male", {
                pitch: 0.7, // Ovozni qalinlashtirish uchun
                rate: 0.95, // Jiddiyroq sekinroq sur'at
                onend: () => {
                    enableSpeakButton();
                }
            });
        }

        function enableSpeakButton() {
            statusBadge.innerText = "Navbat sizniki. Gapiring!";
            mainBtn.innerText = "🎤 GAPIRISH UCHUN BOSING";
            mainBtn.style.display = 'inline-block';
            mainBtn.onclick = recordUserVoice;
        }

        function recordUserVoice() {
            if (!recognition) {
                alert("Brauzeringiz ovozni qo'llab-quvvatlamaydi! Chrome'dan foydalaning.");
                return;
            }

            mainBtn.style.display = 'none';
            statusBadge.innerText = "Sizni eshitayapman... Gapiring!";
            subText.innerHTML = `<b>Siz:</b> Eshitilyapti...`;

            try {
                recognition.start();
            } catch(e) {}

            recognition.onresult = (event) => {
                let text = event.results[0][0].transcript;
                subText.innerHTML = `<b>Siz:</b> ${text}`;
                
                statusBadge.innerText = "Tahlil qilinmoqda...";

                setTimeout(() => {
                    analyzeAndRoast(text);
                }, 800);
            };

            recognition.onerror = () => {
                statusBadge.innerText = "Ovoz eshitilmadi. Qayta bosing.";
                mainBtn.style.display = 'inline-block';
                mainBtn.innerText = "🎤 QAYTADAN GAPIRISH";
            };
        }

        function analyzeAndRoast(text) {
            let words = text.trim().split(/\s+/);
            let wordCount = words.length;

            let roastMsg = "";
            let band = "4.0";

            if (wordCount < 4) {
                band = "3.5";
                roastMsg = "Absolute disaster! Two words? Are you even trying?! This is a pathetic excuse for an IELTS answer. Band 3.5!";
            } else if (wordCount < 10) {
                band = "5.0";
                roastMsg = "Terrible grammar! Zero vocabulary variety! How do you expect to pass with this primitive English? Absolute disappointment!";
            } else {
                band = "6.5";
                roastMsg = "You spoke, but it sounds like a broken robot. Zero natural flow, zero advanced structures. Wake up and try harder!";
            }

            statusBadge.innerText = `Tahlil (Band: ${band}) — Tanqid o'qilmoqda`;
            subText.innerHTML = `<b>AI GG (Band ${band}):</b> ${roastMsg}`;

            // Ruscha yoki ingliz tilidagi erkak ovozida o'ta qattiqqol tanqidni o'qish
            responsiveVoice.speak(roastMsg, "UK English Male", {
                pitch: 0.65,
                rate: 0.9,
                onend: () => {
                    currentQIndex = (currentQIndex + 1) % questions.length;
                    setTimeout(() => {
                        askQuestion();
                    }, 1000);
                }
            });
        }
    </script>
</body>
</html>
