<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monos Speaking AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background-color: #1e293b; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        h1 { font-size: 20px; color: #38bdf8; }
        .topic-box { background: #0f172a; padding: 15px; border-radius: 12px; border-left: 4px solid #38bdf8; margin: 20px 0; text-align: left; }
        .mic-btn { background: #ef4444; color: white; border: none; width: 70px; height: 70px; border-radius: 50%; font-size: 28px; cursor: pointer; margin: 0 auto; }
        .status { margin-top: 15px; font-weight: bold; font-size: 14px; color: #f59e0b; }
        .result-box { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 12px; text-align: left; display: none; }
        .score { font-size: 24px; color: #22c55e; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🗣 Monos AI Examiner</h1>
        <p style="color:#94a3b8; font-size:13px;">IELTS Speaking Strict Feedback</p>
        <div class="topic-box">
            <strong style="color:#e2e8f0;">Part 1 Topic:</strong>
            <div id="topic" style="margin-top:5px; color:#cbd5e1;">Describe your hometown. What do you like most about it?</div>
        </div>
        <button class="mic-btn" id="recordBtn">🎙</button>
        <div class="status" id="status">Tugmani bosing va gapiring</div>
        <div class="result-box" id="resultBox">
            <h3 style="margin:0; color:#38bdf8;">Natija:</h3>
            <div style="margin-top:5px;"><strong>Matn:</strong> <span id="userText" style="color:#cbd5e1;">-</span></div>
            <div style="margin-top:5px;"><strong>Score:</strong> <span class="score" id="score">0.0</span></div>
            <div style="margin-top:10px;"><strong>Qattiqqol Tanqid:</strong></div>
            <p id="feedback" style="color:#f87171; margin-top:5px; font-size:13px;">-</p>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const resultBox = document.getElementById('resultBox');
        const userText = document.getElementById('userText');
        const score = document.getElementById('score');
        const feedback = document.getElementById('feedback');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            let isRecording = false;

            recordBtn.addEventListener('click', () => {
                if (!isRecording) {
                    recognition.start();
                    status.innerText = "Eshitayapman... Gapiring!";
                    recordBtn.style.background = "#22c55e";
                    isRecording = true;
                } else {
                    recognition.stop();
                    status.innerText = "Tahlil qilinmoqda...";
                    recordBtn.style.background = "#ef4444";
                    isRecording = false;
                }
            });

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                userText.innerText = text;
                analyzeSpeech(text);
            };
        } else {
            status.innerText = "Brauzeringiz ovoz yozishni qo'llab-quvvatlamaydi.";
        }

        function analyzeSpeech(text) {
            status.innerText = "Tahlil yakunlandi!";
            resultBox.style.display = "block";
            let wordCount = text.split(" ").length;
            if (wordCount < 5) {
                score.innerText = "4.0";
                feedback.innerText = "Juda qisqa javob! IELTS imtihonida bunday javobga yuqori ball berilmaydi.";
            } else if (wordCount < 12) {
                score.innerText = "5.5";
                feedback.innerText = "Javobingiz juda oddiy. Murakkab grammatika va advanced lug'at ishlatilmadi.";
            } else {
                score.innerText = "6.5";
                feedback.innerText = "Yomon emas, lekin grammatik aniqlikka va linking word'larga e'tibor bering.";
            }
        }
    </script>
</body>
</html>
