<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monos Live GG Examiner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }
        h1 { font-size: 20px; margin: 0; color: #ef4444; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 15px auto;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #7f1d1d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            box-shadow: 0 0 25px #ef4444;
            transition: all 0.3s ease;
        }
        .talking {
            animation: talk 0.25s infinite alternate;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 35px #38bdf8;
        }
        .listening {
            animation: listenPulse 1.2s infinite;
            border: 4px solid #22c55e;
            box-shadow: 0 0 35px #22c55e;
        }
        @keyframes talk {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
        @keyframes listenPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .status-badge {
            background: #1f2937;
            color: #f59e0b;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            border: 1px solid #374151;
            text-align: center;
        }

        .btn-main {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            width: 100%;
            margin-top: 15px;
        }

        .control-btns {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-pause {
            background: #374151;
            color: #f8fafc;
            border: 1px solid #4b5563;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            font-size: 14px;
        }

        .subtitle-box {
            width: 100%;
            background: rgba(17, 24, 39, 0.95);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #374151;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
            margin-top: auto;
        }
        .subtitle-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
            margin-bottom: 5px;
        }
        .subtitle-text {
            font-size: 15px;
            line-height: 1.4;
            color: #f3f4f6;
            min-height: 45px;
        }
        .speaker-tag {
            font-weight: bold;
            margin-right: 5px;
        }
        .speaker-ai { color: #ef4444; }
        .speaker-user { color: #22c55e; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤬 MONOS LIVE GG EXAMINER</h1>

        <div class="avatar-container">
            <div class="avatar" id="avatar">🗿</div>
        </div>

        <div class="status-badge" id="statusBadge">Tayyormisiz?</div>

        <div id="controlsBox" style="display:none;" class="control-btns">
            <button class="btn-pause" id="pauseBtn" onclick="togglePause()">⏸ PAUZA</button>
        </div>

        <div id="startScreen" style="width:100%;">
            <p style="color:#cbd5e1; font-size:14px; text-align:center;">
                Jonli, tugmalarsiz va ayovsiz IELTS Speaking suhbatini boshlash uchun bosing:
            </p>
            <button class="btn-main" onclick="startLiveExam()">🔥 IMTIHONNI BOSHLASH</button>
        </div>

        <div class="subtitle-box" id="subtitleBox" style="display:none;">
            <div class="subtitle-title">JONLI SUBTITR:</div>
            <div class="subtitle-text" id="subText">
                <span class="speaker-tag speaker-ai">AI:</span> Imtihonga xush kelibsiz!
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const avatar = document.getElementById('avatar');
        const statusBadge = document.getElementById('statusBadge');
        const startScreen = document.getElementById('startScreen');
        const subtitleBox = document.getElementById('subtitleBox');
        const controlsBox = document.getElementById('controlsBox');
        const pauseBtn = document.getElementById('pauseBtn');
        const subText = document.getElementById('subText');

        const questions = [
            "Describe your hometown. What do you like most about it?",
            "Do you work or are you a student?",
            "What do you usually do in your free time?"
        ];
        let currentQIndex = 0;
        let isPaused = false;
        let isAiSpeaking = true;
        let activeAudio = null;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;

        if (recognition) {
            recognition.lang = 'en-US';
            recognition.interimResults = true;
            recognition.continuous = true;
        }

        function startLiveExam() {
            startScreen.style.display = 'none';
            subtitleBox.style.display = 'block';
            controlsBox.style.display = 'flex';

            // Ovoz tizimini faollashtirish uchun bo'sh audio chalib yuboramiz
            let silentAudio = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");
            silentAudio.play().catch(e => {});

            startPermanentMic();
            askQuestion();
        }

        function togglePause() {
            if (isPaused) {
                isPaused = false;
                pauseBtn.innerText = "⏸ PAUZA";
                pauseBtn.style.background = "#374151";
                statusBadge.innerText = "Suhbat davom etmoqda...";
                askQuestion();
            } else {
                isPaused = true;
                pauseBtn.innerText = "▶️ DAVOM ETTIRISH";
                pauseBtn.style.background = "#22c55e";
                statusBadge.innerText = "Suhbat pauzada";
                if (activeAudio) activeAudio.pause();
                avatar.className = "avatar";
                avatar.innerText = "⏸️";
            }
        }

        function startPermanentMic() {
            if (!recognition) return;

            recognition.onresult = (event) => {
                if (isPaused || isAiSpeaking) return;

                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                let currentSpeech = finalTranscript || interimTranscript;
                if (currentSpeech.trim().length > 0) {
                    updateSubtitle("Siz", currentSpeech, "speaker-user");
                }

                if (finalTranscript.trim().length > 3) {
                    isAiSpeaking = true;
                    statusBadge.innerText = "Tahlil qilinmoqda...";
                    avatar.className = "avatar";
                    avatar.innerText = "🧐";

                    analyzeAndRoast(finalTranscript);
                }
            };

            recognition.onend = () => {
                if (!isPaused) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            try {
                recognition.start();
            } catch(e) {}
        }

        function askQuestion() {
            if (isPaused) return;

            isAiSpeaking = true;
            let qText = questions[currentQIndex];
            statusBadge.innerText = "AI Examiner gapirmoqda...";
            updateSubtitle("AI", qText, "speaker-ai");

            playCloudAudio(qText, 'en', () => {
                isAiSpeaking = false;
                statusBadge.innerText = "Sizni eshitayapman... Gapiring!";
                avatar.className = "avatar listening";
                avatar.innerText = "👂";
                updateSubtitle("Siz", "Gapiring...", "speaker-user");
            });
        }

        function analyzeAndRoast(text) {
            if (isPaused) return;

            let words = text.trim().split(/\s+/);
            let wordCount = words.length;

            let roastMsg = "";
            let band = "4.0";

            if (wordCount < 4) {
                band = "3.5";
                roastMsg = "Что за мусор?! Это не ответ! Siz imtihondamisiz yoki choyxonadami? Kamida 3 ta gap gapir, leniviy!";
            } else if (wordCount < 10) {
                band = "5.0";
                roastMsg = "Ужас! Где грамматика? Elementarni so'zlar bilan Band 7 olmoqchimisiz? Какой позор! Normalniy linking words ishlat!";
            } else {
                band = "6.5";
                roastMsg = "Ну ладно, bo'ladi... Lekin C1 vocabulary yo'q! Robottga o'xshab qolding. Еще лучше старайся!";
            }

            statusBadge.innerText = `Tahlil (Band: ${band})`;
            avatar.innerText = "🤬";
            
            updateSubtitle(`AI GG (Band ${band})`, roastMsg, "speaker-ai");

            playCloudAudio(roastMsg, 'ru', () => {
                currentQIndex = (currentQIndex + 1) % questions.length;
                setTimeout(() => {
                    askQuestion();
                }, 1000);
            });
        }

        // HTML5 AUDIO STREAM (Telegram da 100% ishlaydigan audio oqimi)
        function playCloudAudio(text, lang, callback) {
            if (isPaused) return;

            isAiSpeaking = true;
            avatar.className = "avatar talking";
            if (lang === 'ru') avatar.innerText = "🤬";
            else avatar.innerText = "🗣️";

            if (activeAudio) {
                activeAudio.pause();
                activeAudio = null;
            }

            // Ochiq va tezkor matndan-ovozga o'girish oqimi
            let audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${lang}&client=tw-ob`;
            
            activeAudio = new Audio(audioUrl);

            let isFinished = false;
            const finish = () => {
                if (!isFinished) {
                    isFinished = true;
                    if (callback && !isPaused) callback();
                }
            };

            activeAudio.onended = finish;
            activeAudio.onerror = () => {
                // Agar tarmoqda xatolik bo'lsa ham suhbat to'xtab qolmasligi uchun zaxira taymer
                setTimeout(finish, 1500);
            };

            activeAudio.play().catch(e => {
                setTimeout(finish, 1500);
            });

            // Xavfsizlik taymeri (matn uzunligiga qarab avtomatik o'tish)
            setTimeout(finish, Math.max(4000, text.length * 120));
        }

        function updateSubtitle(speaker, text, speakerClass) {
            subText.innerHTML = `<span class="speaker-tag ${speakerClass}">${speaker}:</span> ${text}`;
        }
    </script>
</body>
</html>
