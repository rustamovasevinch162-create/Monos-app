<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monos Speaking GG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #111827;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            text-align: center;
        }
        h1 { font-size: 22px; margin: 0; color: #ef4444; text-transform: uppercase; letter-spacing: 1px; }
        
        /* AI Examiner Kalla / Avatar */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 15px auto;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #7f1d1d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            box-shadow: 0 0 20px #ef4444;
            animation: pulse 2s infinite;
        }
        .talking {
            animation: talk 0.4s infinite alternate;
            border: 4px solid #38bdf8;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px #ef4444; }
            50% { transform: scale(1.05); box-shadow: 0 0 30px #ef4444; }
            100% { transform: scale(1); box-shadow: 0 0 15px #ef4444; }
        }
        @keyframes talk {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .topic-box {
            background: #1f2937;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid #ef4444;
            margin: 15px 0;
            text-align: left;
        }
        
        .speak-question-btn {
            background: #374151;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            font-weight: bold;
        }

        .mic-btn {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .recording {
            background: #22c55e !important;
            box-shadow: 0 0 25px #22c55e !important;
            animation: pulse 1s infinite;
        }

        .status { margin: 10px 0; font-weight: bold; font-size: 13px; color: #f59e0b; }

        .result-box {
            margin-top: 15px;
            background: #1f2937;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            display: none;
            border: 1px solid #374151;
        }
        .score-badge {
            background: #dc2626;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            display: inline-block;
        }
        .rage-text {
            color: #f87171;
            font-weight: bold;
            background: rgba(220, 38, 38, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ef4444;
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.4;
        }
        .fix-text {
            color: #4ade80;
            margin-top: 8px;
            font-size: 13px;
            background: rgba(34, 197, 94, 0.1);
            padding: 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🤬 MONOS GG EXAMINER</h1>
        <p style="color:#94a3b8; font-size:12px; margin-top:3px;">Strict & Toxic IELTS Speaking AI</p>

        <!-- AI Examiner Avatar (Kalla) -->
        <div class="avatar-container">
            <div class="avatar" id="avatar">🗿</div>
        </div>

        <div class="topic-box">
            <strong style="color:#ef4444; font-size:12px;">PART 1 QUESTION:</strong>
            <div id="topic" style="margin-top: 4px; color:#f3f4f6; font-weight: 500;">Describe your hometown. What do you like most about it?</div>
            <button class="speak-question-btn" onclick="speakQuestion()">🔊 Savolni eshitish</button>
        </div>

        <button class="mic-btn" id="recordBtn">🎙</button>
        <div class="status" id="status">Mikrofonni bosing va gapiring!</div>

        <div class="result-box" id="resultBox">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="color:#9ca3af; font-size:13px;">IELTS Score:</span>
                <span class="score-badge" id="score">0.0</span>
            </div>
            
            <div style="margin-top:10px; font-size:12px; color:#9ca3af;">
                <strong>Siz aytdingiz:</strong> <i id="userText" style="color:#e5e7eb;">"-"</i>
            </div>

            <div style="margin-top:12px;">
                <strong style="color:#ef4444; font-size:13px;">🤬 GG Examiner Tanqidi:</strong>
                <div class="rage-text" id="feedback">-</div>
            </div>

            <div class="fix-text" id="correctionBox">
                <strong>💡 Qanday aytish kerak edi:</strong>
                <div id="correctionText" style="margin-top:3px;">-</div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const resultBox = document.getElementById('resultBox');
        const userText = document.getElementById('userText');
        const score = document.getElementById('score');
        const feedback = document.getElementById('feedback');
        const correctionText = document.getElementById('correctionText');
        const avatar = document.getElementById('avatar');

        const currentQuestion = "Describe your hometown. What do you like most about it?";

        // Savolni ovozli o'qish (AI Kalla gapiradi)
        function speakQuestion() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(currentQuestion);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                
                utterance.onstart = () => {
                    avatar.classList.add('talking');
                    avatar.innerText = "🗣️";
                };
                utterance.onend = () => {
                    avatar.classList.remove('talking');
                    avatar.innerText = "🗿";
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        // Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            let isRecording = false;

            recordBtn.addEventListener('click', () => {
                if (!isRecording) {
                    try {
                        recognition.start();
                        status.innerText = "Eshitayapman... Gapiring!";
                        recordBtn.classList.add('recording');
                        avatar.innerText = "👂";
                        isRecording = true;
                    } catch(e) {
                        status.innerText = "Qaytadan bosing!";
                    }
                } else {
                    recognition.stop();
                    status.innerText = "Tahlil qilinmoqda...";
                    recordBtn.classList.remove('recording');
                    avatar.innerText = "🧐";
                    isRecording = false;
                }
            });

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                userText.innerText = `"${text}"`;
                analyzeSpeech(text);
            };

            recognition.onerror = () => {
                status.innerText = "Xatolik! Aniqroq va balandroq gapiring.";
                recordBtn.classList.remove('recording');
                avatar.innerText = "🗿";
                isRecording = false;
            };

        } else {
            status.innerText = "Brauzeringiz ovoz yozishni qo'llab-quvvatlamaydi.";
        }

        // Toxic / GG Style Tahlil
        function analyzeSpeech(text) {
            status.innerText = "Tahlil yakunlandi!";
            resultBox.style.display = "block";
            avatar.innerText = "🤬";

            let words = text.trim().split(/\s+/);
            let wordCount = words.length;

            let feedbackMsg = "";
            let fixMsg = "";
            let bandScore = "4.0";

            if (wordCount < 4) {
                bandScore = "3.5";
                feedbackMsg = "Что за мусор?! Это даже ne otvet! Siz imtihondamisiz yoki choyxonadami? Kamida 3 ta to'liq gap gapir, leniviy!";
                fixMsg = "I live in Tashkent, which is the capital city. What I love most about it is the vibrant culture and historic landmarks.";
            } else if (wordCount < 10) {
                bandScore = "5.0";
                feedbackMsg = "Ujas! Grammatika qani? 'Elementary' darajadagi so'zlar bilan Band 7 olmoqchimisiz? Kakoy pozor! Normalniy linking words ishlat!";
                fixMsg = "Well, my hometown is quite unique. Particularly, I am fond of its bustling night life and hospitable local people.";
            } else {
                bandScore = "6.5";
                feedbackMsg = "Nu ladno, bo'ladi... Lekin baribir C1 vocabulary yo'q! Talaffuzda va intonatsiyada robottga o'xshab qolding. Esho luche staraysya!";
                fixMsg = "My hometown is exceptionally picturesque. What truly fascinates me is the seamless blend of modern architecture and rich heritage.";
            }

            score.innerText = bandScore;
            feedback.innerText = feedbackMsg;
            correctionText.innerText = fixMsg;

            // Tanqidni ham AI ovozida o'qib berish (Aralash toxic)
            speakFeedback(feedbackMsg);
        }

        function speakFeedback(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU'; // Ruscha/O'zbekcha toxic intonatsiya berish uchun
                utterance.rate = 1.0;
                utterance.onstart = () => avatar.classList.add('talking');
                utterance.onend = () => {
                    avatar.classList.remove('talking');
                    avatar.innerText = "🤬";
                };
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
    </html>
